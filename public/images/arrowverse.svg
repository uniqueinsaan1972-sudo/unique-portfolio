<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#gameBg)"/>
  <circle cx="400" cy="200" r="160" fill="#10b981" opacity="0.1"/>
  <!-- Game HUD Frame -->
  <rect x="100" y="50" width="600" height="350" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <!-- Game Canvas Header -->
  <rect x="130" y="70" width="180" height="12" rx="6" fill="#10b981"/>
  <text x="620" y="82" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="700" font-size="14">80% COMPLETE</text>
  <!-- Arrow Graphic -->
  <path d="M 220 230 L 450 230 M 420 210 L 460 230 L 420 250" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Target circles -->
  <circle cx="550" cy="230" r="45" fill="none" stroke="#ef4444" stroke-width="6"/>
  <circle cx="550" cy="230" r="30" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="550" cy="230" r="15" fill="#10b981"/>
  <!-- Game Title -->
  <text x="400" y="340" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="2">ARROWVERSE 2D GAME</text>
  <text x="400" y="370" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14">Unity 2D • C# Physics Engine • Action Adventure</text>
</svg>
