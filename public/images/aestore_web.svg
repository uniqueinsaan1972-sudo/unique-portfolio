<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
    <linearGradient id="pinkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#fashionBg)"/>
  <rect x="100" y="50" width="600" height="350" rx="20" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="100" y="50" width="600" height="55" rx="20" fill="#0f172a"/>
  <text x="140" y="85" fill="url(#pinkGold)" font-family="system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="1">AESTORE</text>
  <text x="260" y="83" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="13">MEN • WOMEN • FASHION</text>
  
  <rect x="560" y="66" width="110" height="26" rx="13" fill="url(#pinkGold)"/>
  <text x="615" y="83" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">CART (2)</text>

  <!-- Fashion Collection Grid -->
  <!-- Women's Collection Card -->
  <rect x="140" y="130" width="240" height="190" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="155" y="145" width="210" height="110" rx="8" fill="#312e81"/>
  <text x="260" y="205" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="800" font-size="18">WOMEN'S DRESSES</text>
  <text x="155" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Ethnic & Modern Wear</text>
  <text x="155" y="302" fill="#ec4899" font-family="system-ui, sans-serif" font-weight="800" font-size="15">$49.99</text>

  <!-- Men's Collection Card -->
  <rect x="420" y="130" width="240" height="190" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="435" y="145" width="210" height="110" rx="8" fill="#1e1b4b"/>
  <text x="540" y="205" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-weight="800" font-size="18">MEN'S FASHION</text>
  <text x="435" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Casual & Formal Shirts</text>
  <text x="435" y="302" fill="#818cf8" font-family="system-ui, sans-serif" font-weight="800" font-size="15">$39.99</text>

  <text x="400" y="365" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Online Fashion & Apparel Shopping Portal</text>
</svg>
