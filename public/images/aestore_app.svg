<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="appFashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#appFashionBg)"/>
  <rect x="270" y="45" width="260" height="360" rx="30" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <rect x="285" y="75" width="230" height="300" rx="20" fill="#18181b"/>
  
  <!-- Mobile Header -->
  <rect x="300" y="95" width="130" height="18" rx="6" fill="url(#roseGradient)"/>
  <text x="305" y="109" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="11">AEstore Fashion</text>
  <circle cx="490" cy="104" r="10" fill="#334155"/>
  
  <!-- Women & Men Banner -->
  <rect x="300" y="125" width="200" height="95" rx="12" fill="#881337"/>
  <text x="400" y="165" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="15">NEW ARRIVALS</text>
  <text x="400" y="185" text-anchor="middle" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11">Men & Women Outfits 50% OFF</text>

  <!-- Product Items -->
  <rect x="300" y="230" width="95" height="70" rx="8" fill="#27272a"/>
  <text x="347" y="270" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Dresses</text>
  
  <rect x="405" y="230" width="95" height="70" rx="8" fill="#27272a"/>
  <text x="452" y="270" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Shirts</text>

  <rect x="300" y="315" width="200" height="38" rx="10" fill="url(#roseGradient)"/>
  <text x="400" y="339" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">SHOP NOW</text>
</svg>
