<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="40" fill="#ffffff" stroke="#18181b" stroke-width="12"/>
  
  <!-- Grid Lines -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="100" y1="100" x2="400" y2="100" />
    <line x1="100" y1="180" x2="400" y2="180" />
    <line x1="100" y1="260" x2="400" y2="260" />
    <line x1="100" y1="340" x2="400" y2="340" />

    <line x1="100" y1="100" x2="100" y2="340" />
    <line x1="175" y1="100" x2="175" y2="340" />
    <line x1="250" y1="100" x2="250" y2="340" />
    <line x1="325" y1="100" x2="325" y2="340" />
    <line x1="400" y1="100" x2="400" y2="340" />
  </g>

  <!-- Grid Dots -->
  <g fill="#27272a">
    <circle cx="100" cy="180" r="5"/>
    <circle cx="175" cy="180" r="5"/>
    <circle cx="250" cy="180" r="5"/>
    <circle cx="325" cy="180" r="5"/>
    <circle cx="400" cy="180" r="5"/>

    <circle cx="100" cy="260" r="5"/>
    <circle cx="175" cy="260" r="5"/>
    <circle cx="250" cy="260" r="5"/>
    <circle cx="325" cy="260" r="5"/>
    <circle cx="400" cy="260" r="5"/>
  </g>

  <!-- ArrowVerse Logo Black Node Path -->
  <!-- 'A' Left leg to Peak (150,330) -> (210,120) -->
  <line x1="140" y1="330" x2="210" y2="120" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  <!-- 'A' Peak to Right leg node (210,120) -> (315,360) -->
  <line x1="210" y1="120" x2="315" y2="360" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  <!-- 'A' Crossbar to Right Arrow (170,240) -> (280,240) -->
  <line x1="170" y1="240" x2="270" y2="240" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 260 220 L 295 240 L 260 260 Z" fill="#18181b"/>

  <!-- 'V' Right leg up to Upward Arrow (315,360) -> (400,210) -->
  <line x1="315" y1="360" x2="400" y2="210" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  <line x1="400" y1="210" x2="400" y2="120" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 380 140 L 400 100 L 420 140 Z" fill="#18181b"/>

  <!-- Node Dots -->
  <circle cx="140" cy="330" r="16" fill="#18181b"/>
  <circle cx="210" cy="120" r="16" fill="#18181b"/>
  <circle cx="240" cy="240" r="14" fill="#18181b"/>
  <circle cx="315" cy="360" r="16" fill="#18181b"/>
  <circle cx="400" cy="210" r="14" fill="#18181b"/>

  <!-- Text -->
  <text x="250" y="450" text-anchor="middle" fill="#18181b" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="1">Arrow Verse</text>
</svg>
